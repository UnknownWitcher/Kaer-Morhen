context.modules = [
{   
    name = libpipewire-module-filter-chain
    args = {
        node.description =  "Fifine Microphone (Filtered)"
        media.name =  "Fifine Microphone (Filtered)"

        filter.graph = {
            nodes = [
                {
                    type = ladspa
                    name = rnnoise
                    plugin = /usr/lib/ladspa/librnnoise_ladspa.so
                    label = noise_suppressor_stereo
                    control = {
                        "VAD Threshold (%)" = 50.0
                        "VAD Grace Period (ms)" = 200
                        "Retroactive VAD Grace (ms)" = 0
                    }
                }
            ]
        }
        capture.props = {
            node.name =  "input.fifine_mic_filtered"
            target.object = "alsa_input.usb-3142_fifine_Microphone-00.pro-input-0"
            audio.channels   = 2
        }

        playback.props = {
            node.name =  "output.fifine_mic_filtered"
            media.class = Audio/Source
            audio.channels   = 2
        }
    }
}
]
